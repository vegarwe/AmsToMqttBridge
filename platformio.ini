;PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; Build:            pio run
; Build + flash:    pio run -t upload
; Serial monitor:   pio device monitor
; Flash over WiFi:  deploy/push-ota.sh <device-ip>

[platformio]
default_envs = featheresp32
src_dir = ArduinoCode/AmsToMqttBridge
lib_dir = ArduinoCode/Libraries
; Optional, gitignored, see the end of this file.
extra_configs = platformio_local*.ini

[env:featheresp32]
board = featheresp32
framework = arduino

; Everything is pinned: espressif32 8.0.0 ships
; arduino-esp32 3.3.12. Bump deliberately, not by accident.
platform = platformio/espressif32@8.0.0
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    256dpi/MQTT@^2.5.2
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8

; Two 1.9 MB OTA slots instead of the default 1.25 MB. The image is ~1.05 MB
; today (80% of the default slot); a device in the basement that outgrows its slot can only be fixed
; with a cable, and the partition table itself can only change over USB.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Machine-specific settings (serial port, upload speed) go in
; platformio_local.ini, which is gitignored. Recommended if more than one
; ESP32 board is plugged in, so an auto-detected upload cannot pick the wrong
; one. Pin the board by its /dev/serial/by-id/ path, which contains the USB
; chip's serial number and does not move between boots:
;
;   [env:featheresp32]
;   upload_port  = /dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_<serial>-if00-port0
;   monitor_port = ${this.upload_port}
